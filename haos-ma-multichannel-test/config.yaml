name: Music Assistant multichannel test
version: "0.1.3"
slug: ma_multichannel_test
description: Local test image layering the locally patched 2.10.4 server wheel over Music Assistant+
startup: application
boot: manual
arch:
  - aarch64
init: false
ingress: true
ingress_port: 8094
auth_api: true
homeassistant_api: true
ports:
  8095/tcp: 18095
ports_description:
  8095/tcp: Local multichannel test server (web UI and API)
audio: true
apparmor: true
tmpfs: true
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
map:
  - media:rw
  - ssl:ro
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
panel_icon: mdi:playlist-music
panel_title: Music Assistant multichannel test
options:
  log_level: info
schema:
  log_level: list(none|fatal|error|warning|info|debug|vdebug)?
