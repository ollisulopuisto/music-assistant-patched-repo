name: "Music Assistant (Up Next test)"
version: "0.0.5"
slug: "music_assistant_upnext_test"
description: "Pocket Casts Up Next queue test build - throwaway, runs its own empty library"
url: "https://github.com/ollisulopuisto/ma-server/pull/1"
arch:
  - aarch64
  - amd64
image: "ghcr.io/ollisulopuisto/ma-server-test"
init: false
map:
  - config:rw
  - share:rw
  - ssl:ro
  - media:rw
options:
  log_level: info
schema:
  log_level: list(none|fatal|error|warning|info|debug|vdebug)?
ingress: true
ingress_port: 8095
panel_icon: mdi:playlist-music
panel_title: MA Up Next test
devices:
  - /dev/snd:/dev/snd:rw
cap_add:
  - SYS_NICE
  - SYS_RESOURCE
# host_network is the key that actually shares the host's network stack. "network: host" is
# not that - "network" maps ports - so the container kept a 172.30.32.0/23 Supervisor address
# and handed Cast devices a stream URL they cannot route to.
host_network: true
# the Home Assistant provider authenticates through the Supervisor, which needs this grant;
# without it setup fails with "Invalid access"
homeassistant_api: true
privileged:
  - SYS_ADMIN
  - NET_ADMIN
