name: "Music Assistant (Up Next test)"
version: "0.0.1.dev1"
slug: "music_assistant_upnext_test"
description: "Pocket Casts Up Next playlist test build - throwaway, runs its own empty library"
url: "https://github.com/ollisulopuisto/ma-server/pull/1"
arch:
  - aarch64
  - amd64
image: "ghcr.io/ollisulopuisto/ma-server-test"
init: false
map:
  - config:rw
  - share:rw
  - ssl:ro
  - media:rw
options:
  log_level: info
schema:
  log_level: list(none|fatal|error|warning|info|debug|vdebug)?
ingress: true
ingress_port: 8095
panel_icon: mdi:playlist-music
panel_title: MA Up Next test
devices:
  - /dev/snd:/dev/snd:rw
cap_add:
  - SYS_NICE
  - SYS_RESOURCE
network: host
privileged:
  - SYS_ADMIN
  - NET_ADMIN
