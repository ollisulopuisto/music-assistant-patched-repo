name: "Music Assistant (Pocket Casts Up Next)"
version: "2.10.0-upnext.1"
slug: "music_assistant_upnext_test"
description: "Music Assistant stable with the Pocket Casts Up Next patches applied"
url: "https://github.com/ollisulopuisto/music-assistant-patched-repo"
arch:
  - aarch64
  - amd64
image: "ghcr.io/ollisulopuisto/ma-server-patched"
init: false
map:
  - config:rw
  - share:rw
  - ssl:ro
  - media:rw
options:
  log_level: info
schema:
  log_level: list(none|fatal|error|warning|info|debug|vdebug)?
ingress: true
ingress_port: 8095
panel_icon: mdi:playlist-music
panel_title: Music Assistant
devices:
  - /dev/snd:/dev/snd:rw
cap_add:
  - SYS_NICE
  - SYS_RESOURCE
# host_network is the key that actually shares the host's network stack. "network: host" is
# not that - "network" maps ports - so the container kept a 172.30.32.0/23 Supervisor address
# and handed Cast devices a stream URL they cannot route to.
host_network: true
# the Home Assistant provider authenticates through the Supervisor, which needs this grant;
# without it setup fails with "Invalid access"
homeassistant_api: true
privileged:
  - SYS_ADMIN
  - NET_ADMIN
